<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Preenche Vaga</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Preenche Vaga</h1>
  <p class="aviso">Seu Currículo fica salvo só neste navegador. A extensão preenche, mas quem envia é você.</p>

  <section class="importar">
    <label for="arquivo">Importar currículo (.docx)</label>
    <input id="arquivo" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document">
  </section>

  <form id="curriculo">
    <label for="nome">Nome completo</label>
    <input id="nome" name="nome" autocomplete="name">

    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" autocomplete="email">

    <label for="telefone">Telefone</label>
    <input id="telefone" name="telefone" type="tel" autocomplete="tel">

    <label for="cidade">Cidade</label>
    <input id="cidade" name="cidade" autocomplete="address-level2">

    <label for="linkedin">LinkedIn</label>
    <input id="linkedin" name="linkedin" placeholder="linkedin.com/in/...">

    <label for="portfolio">Portfólio (GitHub ou site)</label>
    <input id="portfolio" name="portfolio" placeholder="github.com/...">

    <label for="objetivo">Objetivo</label>
    <textarea id="objetivo" name="objetivo" rows="2"></textarea>

    <label for="resumo">Resumo profissional</label>
    <textarea id="resumo" name="resumo" rows="4"></textarea>

    <label for="curso">Curso (formação mais recente)</label>
    <input id="curso" name="curso">

    <label for="instituicao">Instituição de ensino</label>
    <input id="instituicao" name="instituicao">

    <label for="cargo">Cargo mais recente</label>
    <input id="cargo" name="cargo">

    <label for="empresa">Empresa mais recente</label>
    <input id="empresa" name="empresa">

    <label for="habilidades">Habilidades</label>
    <textarea id="habilidades" name="habilidades" rows="2"></textarea>

    <label for="idiomas">Idiomas</label>
    <input id="idiomas" name="idiomas">

    <button type="submit" id="salvar">Salvar Currículo</button>
  </form>

  <button type="button" id="preencher" class="principal">Preencher esta página</button>
  <p id="status" role="status"></p>

  <script src="importar-docx.js"></script>
  <script src="popup.js"></script>
</body>
</html>
