<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario de candidatura para teste</title>
</head>
<body>
  <main>
    <h1>Formulario de candidatura</h1>
    <form>
      <p>
        <label for="n">Nome completo</label>
        <input id="n" name="nome_completo" autocomplete="name">
      </p>
      <p>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="email">
      </p>
      <p>
        <label for="telefone">Telefone</label>
        <input id="telefone" name="telefone" type="tel" autocomplete="tel">
      </p>
      <p>
        <label for="linkedin">LinkedIn</label>
        <input id="linkedin" name="linkedin" type="url">
      </p>
      <p>
        <label for="cidade">Cidade</label>
        <input id="cidade" name="cidade" autocomplete="address-level2">
      </p>
    </form>
  </main>
</body>
</html>
